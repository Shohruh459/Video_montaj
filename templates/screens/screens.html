<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;width:540px;height:960px;background:#0a0f1d;font-family:'DejaVu Sans',sans-serif;overflow:hidden;color:#e2e8f0}
.mono{font-family:'DejaVu Sans Mono',monospace}.bar{height:46px;background:#111827;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid #1f2937}
.dot{width:11px;height:11px;border-radius:50%}.tab{margin-left:14px;font-size:14px;color:#94a3b8}
#code{position:absolute;top:46px;left:0;right:0;bottom:0;padding:16px 12px;font-size:17px;line-height:25px;white-space:pre}
.ln{color:#475569;display:inline-block;width:34px;text-align:right;margin-right:12px;user-select:none}
.k{color:#c084fc}.s{color:#86efac}.n{color:#fbbf24}.c{color:#64748b}.f{color:#7dd3fc}.cur{display:inline-block;width:9px;height:19px;background:#38bdf8;vertical-align:-3px}
#chat{position:absolute;top:46px;left:0;right:0;bottom:0;padding:18px 14px;font-size:20px;line-height:28px}
.b{max-width:86%;padding:12px 16px;border-radius:18px;margin:0 0 14px;white-space:pre-wrap}.u{background:#2563eb;margin-left:auto;border-bottom-right-radius:4px}.a{background:#1e293b;border-bottom-left-radius:4px}
.av{display:flex;align-items:center;gap:8px;font-size:14px;color:#94a3b8;margin-bottom:6px}.av i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#a78bfa);display:inline-block}
.typing span{display:inline-block;width:9px;height:9px;border-radius:50%;background:#94a3b8;margin-right:5px}
.cb{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:21px;white-space:pre}
#term{position:absolute;top:46px;left:0;right:0;bottom:0;padding:16px 14px;font-size:17px;line-height:26px;white-space:pre-wrap;background:#05080f}
.r{color:#f87171}.g{color:#4ade80}.y{color:#facc15}.d{color:#64748b}
</style>
<div class="bar"><div class="dot" style="background:#f87171"></div><div class="dot" style="background:#facc15"></div><div class="dot" style="background:#4ade80"></div><div class="tab" id="tab"></div></div>
<div id="v"></div>
<script>
const P=JSON.parse(decodeURIComponent(location.hash.slice(1)));const V=document.getElementById('v');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hl(line){let h=esc(line);const m=h.match(/^(\s*)(\/\/.*)$/);if(m)return m[1]+'<span class=c>'+m[2]+'</span>';
 h=h.replace(/('[^']*'|"[^"]*"|`[^`]*`)/g,'<span class=s>$1</span>').replace(/\b(const|let|function|return|if|else|await|async|import|from|try|catch|throw|new)\b/g,'<span class=k>$1</span>').replace(/\b(\d+)\b/g,'<span class=n>$1</span>').replace(/\b([a-zA-Z_]+)(?=\()/g,'<span class=f>$1</span>');return h}
const CODE=["// login.js","import { validate } from './form';","","async function login(email, pass) {","  if (!validate(email, pass)) {","    throw new Error('Maʼlumot xato');","  }","  const res = await fetch('/api/login', {","    method: 'POST',","    body: JSON.stringify({ email, pass }),","  });","  if (!res.ok) {","    return { ok: false, code: res.status };","  }","  const user = await res.json();","  localStorage.setItem('user', user.id);","  return { ok: true, user };","}","","document.querySelector('form')","  .addEventListener('submit', onSubmit);"];
const ALL=CODE.join('\n');
function code(t){document.getElementById('tab').textContent='login.js';const n=Math.min(ALL.length,Math.floor(Math.max(0,t-0.3)*P.cps));const txt=ALL.slice(0,n);const lines=txt.split('\n');
 const vis=lines.slice(Math.max(0,lines.length-30));const start=lines.length-vis.length;
 V.innerHTML='<div id=code class=mono>'+vis.map((l,i)=>'<span class=ln>'+(start+i+1)+'</span>'+hl(l)+(i===vis.length-1?'<span class=cur style="opacity:'+(Math.floor(t*2.2)%2?0.2:1)+'"></span>':'')).join('\n')+'</div>';}
function typed(s,t,t0,cps){return s.slice(0,Math.max(0,Math.min(s.length,Math.floor((t-t0)*cps))))}
function chat(t){document.getElementById('tab').textContent='AI yordamchi';
 const q='Login sahifa yasab ber',a1='Albatta! Reja:\n1) forma maydonlari\n2) validatsiya\n3) xatolarni ko‘rsatish',code1='function validate(email, pass) {\n  return email.includes("@") &&\n         pass.length >= 8;\n}';
 let h='';const tq=typed(q,t,0.4,18);h+='<div class="b u">'+esc(tq)+'</div>';
 if(t>1.9){h+='<div class=av><i></i>Yordamchi</div>';if(t<3.0)h+='<div class="b a typing"><span style="opacity:'+(0.4+0.6*Math.abs(Math.sin(t*6)))+'"></span><span style="opacity:'+(0.4+0.6*Math.abs(Math.sin(t*6+1)))+'"></span><span style="opacity:'+(0.4+0.6*Math.abs(Math.sin(t*6+2)))+'"></span></div>';
  else{h+='<div class="b a">'+esc(typed(a1,t,3.0,34));if(t>4.6)h+='<div class="cb mono">'+esc(typed(code1,t,4.6,48))+'</div>';h+='</div>'}}
 V.innerHTML='<div id=chat>'+h+'</div>';}
function term(t){document.getElementById('tab').textContent='terminal';const fail=P.variant==='fail';
 const L=[[0.3,'<span class=g>~/loyiha</span> <span class=d>$</span> npm test'],[1.2,'<span class=d>> jest --runInBand</span>'],[1.9,''],
 fail?[2.2,'<span class=r>FAIL</span>  src/login.test.js']:[2.2,'<span class=g>PASS</span>  src/login.test.js'],
 fail?[2.7,'  <span class=r>✕ validates email (8 ms)</span>']:[2.7,'  <span class=g>✓ validates email (8 ms)</span>'],
 fail?[3.1,'  <span class=g>✓ renders form (12 ms)</span>']:[3.1,'  <span class=g>✓ renders form (12 ms)</span>'],
 fail?[3.6,'  <span class=r>✕ submits data (31 ms)</span>']:[3.6,'  <span class=g>✓ submits data (31 ms)</span>'],
 fail?[4.2,'']:[4.2,''],
 fail?[4.4,'<span class=r>TypeError: undefined is not a function</span>']:[4.4,'<span class=g>Test Suites: 1 passed, 1 total</span>'],
 fail?[4.9,'<span class=d>    at validate (src/login.js:482)</span>']:[4.9,'<span class=g>Tests:       24 passed, 24 total</span>'],
 fail?[5.4,'<span class=r>Tests:       3 failed, 21 passed</span>']:[5.4,'<span class=g>✓ Hammasi o‘tdi</span>']];
 V.innerHTML='<div id=term class=mono>'+L.filter(x=>t>=x[0]).map(x=>x[1]).join('\n')+(Math.floor(t*2)%2?'<span class=cur></span>':'')+'</div>';}
window.setT=(t)=>{({code,chat,term})[P.page](t);return 1};window.ready=true;
</script>
